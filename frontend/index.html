<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha E-Commerce Store</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="container">
            <h1 class="logo">ShopEasy</h1>

            <nav>
                <a href="#">Home</a>
                <a href="#products">Products</a>
                <a href="#cart">Cart</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="container">
                <h2>Welcome to ShopEasy</h2>
                <p>Discover quality products at great prices.</p>
            </div>
        </section>

        <section id="products" class="products-section">
            <div class="container">
                <h2>Our Products</h2>

                <div id="product-list" class="product-list">
                    <!-- Products will be loaded here using JavaScript -->
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 ShopEasy. Built as part of CodeAlpha Full Stack Development Internship.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
